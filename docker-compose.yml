services:
  postgres:
    image: postgres:16
    container_name: vlx_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aasim123
      POSTGRES_DB: vlx_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: